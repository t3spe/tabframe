# Tabframe — tooling, environment, and tasks. Everything installs through mise.
[tools]
# Pinned (WP8.1): the deploy path runs under an admin identity, so the CLIs it runs are exact.
node = "22.23.2"
bun = "1.3.13"
aws-cli = "2.36.37"
gh = "2.97.0"
"npm:aws-cdk" = "2.1139.0"

[env]
AWS_PROFILE = "tabframe"
AWS_REGION = "us-west-2"
_.file = ".env.local" # gitignored: TABFRAME_ACCOUNT_ID, TABFRAME_BUDGET_EMAIL

[tasks.install]
description = "Install workspace dependencies and the Playwright browser"
run = ["bun install", "bunx playwright install chromium"]

[tasks.whoami]
description = "Assert the AWS identity is the Tabframe account; every AWS task depends on it"
run = "node packages/infra/scripts/whoami.ts"

[tasks.lint]
description = "Biome lint and format check, then a TypeScript type check"
run = [
  "bunx biome check .",
  "bunx tsc -p tsconfig.json --noEmit",
  "bunx tsc -p packages/web/tsconfig.json --noEmit",
  "bunx tsc -p packages/infra/tsconfig.json --noEmit",
]

[tasks.test]
description = "Unit and integration tests, then browser tests"
depends = ["lint"]
run = ["bun test", "bunx playwright test --pass-with-no-tests"]

[tasks.dev]
description = "Local topology: control plane, local store, two local cores, web bundles in watch mode"
run = "node packages/dev/src/up.ts"

[tasks."dev:rotate"]
description = "Start a second control plane and run a local handover"
run = "node packages/dev/src/rotate.ts"

[tasks.sim]
description = "Churn simulation (--seed N, --long)"
run = "node packages/core/sim/run.ts"

[tasks.transcripts]
description = "Export the build's session transcripts as scrubbed Markdown into docs/transcripts (reviewed by hand before they are committed)"
run = "node scripts/transcripts/export.ts"

[tasks.goldens]
description = "Regenerate program goldens from single-node runs"
run = [
  "node packages/sdk-as/scripts/goldens.ts",
  "node packages/sdk-as/scripts/goldens.ts --program wordcount",
]

[tasks.corpus]
description = "Fetch and normalize the word-count corpus into programs/wordcount/in/corpus.txt"
run = "node packages/sdk-as/scripts/corpus.ts"

[tasks."build:programs"]
description = "Compile the AssemblyScript demo programs"
run = "node packages/sdk-as/scripts/build-programs.ts"

[tasks."build:web"]
description = "Bundle the browser entry points and copy static files (--watch for the dev loop)"
run = "bun packages/web/scripts/build.ts"

[tasks."build:image"]
description = "Bundle the control-plane process and stage the MicroVM image directory"
# The image carries the compiled programs: they must be built first (a new program was once
# staged before its first build and missed the image — WP6.5).
depends = ["build:programs"]
run = [
  "bun build packages/control-plane/src/main.ts --target=node --format=esm --outfile packages/control-plane/dist/main.js",
  # The sandbox's worker thread is a second entry point: one bundled file cannot be its own worker.
  "bun build packages/sandbox/src/adapters/node-worker.ts --target=node --format=esm --outfile packages/control-plane/dist/node-worker.js",
  "node packages/infra/scripts/stage-image.ts",
]

[tasks.build]
description = "Build everything"
depends = ["build:programs", "build:web", "build:image"]

[tasks.deploy]
description = "Build, test, check the tree is committed and on main, deploy the stacks, then bring the machine up (on + rotate, which hands the ledger over)"
depends = ["whoami"]
# Sequential (WP8.1): build, then test against what was built, then a guard — a clean tree whose
# HEAD is on origin/main, so an image is always attributable to a green commit — then the stacks.
# TABFRAME_DEPLOY_UNGATED=1 skips the guard for an emergency deploy from a branch.
run = [
  "mise run build",
  "mise run test",
  "node packages/infra/scripts/deploy-guard.ts",
  "TABFRAME_IMAGE_DIR=packages/infra/image-dist cdk deploy --all --require-approval never",
  "node packages/fleet/scripts/up.ts",
]

[tasks.verify]
description = "M0 runbook against the real account (masked output)"
depends = ["whoami"]
run = "node packages/infra/scripts/verify-m0.ts"

[tasks."verify:m2"]
description = "M2 runbook: edit and compile a program in the deployed page, run word count, make a program fault"
depends = ["whoami"]
run = "node packages/infra/scripts/verify-m2.ts"

[tasks."verify:m3"]
description = "M3 runbook: a real rotation under load — churn seconds, drain jitter, session-function concurrency"
depends = ["whoami"]
run = "node packages/infra/scripts/verify-m3.ts"

[tasks.demo]
description = "WP4.4: run the demo script unattended against the deployed machine (TABFRAME_VIDEO=1 records)"
run = "node packages/infra/scripts/demo.ts"

[tasks."verify:m1"]
description = "M1 runbook: browser tabs render a frame on the deployed machine, kill half mid-frame, golden hashes, uploads, snapshots"
depends = ["whoami"]
run = "node packages/infra/scripts/verify-m1.ts"

[tasks.rotate]
description = "One rotation now, the same code the hourly rule runs (masked output)"
depends = ["whoami"]
run = "node packages/fleet/scripts/rotate.ts"

[tasks.up]
description = "Clear the off state and launch a control plane"
depends = ["whoami"]
run = "node packages/fleet/scripts/up.ts"

[tasks.down]
description = "Off: disable the schedule, terminate every MicroVM, write the off state"
depends = ["whoami"]
run = "node packages/fleet/scripts/down.ts"

[tasks.logs]
description = "Tail the MicroVM logs (control planes and cores; one stream per MicroVM)"
depends = ["whoami"]
run = "aws logs tail /aws/lambda/microvms/tabframe --follow --format short"

[tasks."logs:fleet"]
description = "Tail the session and rotate functions' logs"
depends = ["whoami"]
run = "aws logs tail /aws/lambda/tabframe-rotate --follow --format short & aws logs tail /aws/lambda/tabframe-session --follow --format short; wait"

[tasks.health]
description = "The control plane's /health through the proxy (fleet token, private port), masked"
depends = ["whoami"]
run = "node packages/infra/scripts/health.ts"
