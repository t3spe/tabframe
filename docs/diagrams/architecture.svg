<text x="490" y="563" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#5b6673">an SSM parameter names the active control plane and its generation</text>
