<rect x="629.91" y="118" width="80.17999999999999" height="16" rx="3" fill="#f6f7f9"/><text x="670" y="129" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" fill="#5b6673">GET by hash</text>
