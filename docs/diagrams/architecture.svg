<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="t d">
<title id="t">Tabframe architecture</title>
<desc id="d">Browser tabs and cloud cores run the same orchestrator and talk WebSocket to one control plane on a Lambda MicroVM, whose ledger is snapshotted to S3 every five seconds and handed to its successor at the hourly rotation; results and the page live in S3 behind CloudFront; the fleet's session and rotate functions and an SSM pointer stand beside it.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#5b6673"/></marker>
</defs>
<rect width="980" height="600" fill="#f6f7f9"/>
