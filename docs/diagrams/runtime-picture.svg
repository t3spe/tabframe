<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d">
<title id="t">Tabframe runtime picture</title>
<desc id="d">One browser tab is one host: the page loads from CloudFront, fetches a session, opens an observer socket to the control plane MicroVM, and spawns node workers with sockets of their own; results go to S3 by presigned PUT and are read back by hash through CloudFront. Two cloud core MicroVMs run the same image as cores, outbound only. The fleet is a session function, a rotate function, and an SSM parameter naming the active control plane.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#5b6673"/></marker>
</defs>
