<text x="580" y="28" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11" font-weight="600" fill="#5b6673">AWS · US-WEST-2</text>
