name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "1"
  MISE_VERSION: 2026.4.11 # same version as the developer machine

jobs:
  test:
    name: lint, unit, browser
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no AWS credentials and no local secrets
        run: |
          test ! -f .env.local || { echo ".env.local must not exist in CI" >&2; exit 1; }
          if env | grep -qE '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE)='; then
            echo "AWS credentials or profile present in the CI environment" >&2; exit 1
          fi
          if grep -rEn 'secrets\.AWS' .github/workflows/; then
            echo "a workflow references AWS secrets" >&2; exit 1
          fi
          echo "ok: no AWS credentials, no .env.local"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true

      - name: Cache the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-cache-${{ runner.os }}-
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Build the demo programs
        # The simulation and the browser suites need programs/*/dist, which is not committed.
        run: mise run build:programs
      - name: Synthesise the CDK app (no credentials; the placeholder image and the public dir stand in)
        run: TABFRAME_IMAGE_PLACEHOLDER=1 TABFRAME_WEB_DIST=packages/web/public bunx cdk synth --all --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-west-2

      - name: Lint and type check
        run: mise run lint

      - name: Unit tests with coverage threshold
        run: bun test

      - name: Browser tests
        run: bunx playwright test --pass-with-no-tests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  nightly-sim:
    name: nightly long churn simulation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true

      - name: Cache the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-cache-${{ runner.os }}-
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Long churn simulation
        run: |
          if [ ! -f packages/core/sim/run.ts ]; then
            echo "::notice::simulation harness not present yet (arrives in WP1.9); nothing to run"
            exit 0
          fi
          mise run sim -- --long
