name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "1"
  MISE_VERSION: 2026.4.11 # same version as the developer machine

jobs:
  test:
    name: build, synth, lint, unit, browser
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no AWS credentials and no local secrets
        run: |
          test ! -f .env.local || { echo ".env.local must not exist in CI" >&2; exit 1; }
          if env | grep -qE '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE)='; then
            echo "AWS credentials or profile present in the CI environment" >&2; exit 1
          fi
          if grep -rEn 'secrets\.AWS' .github/; then
            echo "a workflow or action references AWS secrets" >&2; exit 1
          fi
          echo "ok: no AWS credentials, no .env.local"

      - uses: ./.github/actions/setup
        with:
          mise-version: ${{ env.MISE_VERSION }}

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Build, synthesise, lint and test, the way a developer runs it
        # The same list as `mise run ci` on a laptop: the web bundle, the control-plane bundle and
        # the staged image are built here too, not for the first time during a deploy.
        run: mise run ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  nightly-sim:
    name: nightly long churn simulation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          mise-version: ${{ env.MISE_VERSION }}

      - name: Long churn simulation
        run: mise run sim -- --long
