name: Set up the toolchain
description: mise with the pinned tools, the Bun install cache, and the workspace dependencies

inputs:
  mise-version:
    description: The mise release to install (the developer machine's)
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}
        install: true
        cache: true

    - name: Cache the Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-install-cache-${{ runner.os }}-

    - name: Install workspace dependencies
      shell: bash
      run: bun install --frozen-lockfile
